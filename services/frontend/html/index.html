<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CISIA Emploi - Retour a l'emploi</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: .7rem 0 .2rem; font-size: .9rem; }
    input, select, textarea { width: 100%; padding: .55rem; box-sizing: border-box; }
    textarea { min-height: 120px; resize: vertical; }
    button { margin-top: 1rem; padding: .7rem 1.2rem; font-size: 1rem; cursor: pointer; }
    #result { margin-top: 1rem; padding: 1rem; border-radius: 8px; display: none; }
    #feedbackPanel { margin-top: 1rem; padding: 1rem; border: 1px solid #d0d7de; border-radius: 8px; display: none; }
    #requestId { font-family: monospace; background: #f6f8fa; padding: .2rem .4rem; }
    #feedbackStatus { min-height: 1.2rem; margin-bottom: 0; }
    .ok { background: #e6f4ea; } .ko { background: #fce8e6; }
  </style>
</head>
<body>
  <h1>Orientation vers le retour a l'emploi</h1>
  <p>Évaluez le délai probable de retour à l'emploi.</p>

  <form id="scoreForm">
    <label for="age">Age</label>
    <input type="number" id="age" name="age" min="16" max="100" value="35" required>

    <label for="niveau_diplome">Niveau de diplôme</label>
    <select id="niveau_diplome" name="niveau_diplome" required>
      <option>Sans diplôme</option>
      <option>Bac</option>
      <option selected>Bac+2</option>
      <option>Bac+5</option>
    </select>

    <label for="anciennete_poste_ans">Ancienneté dans le dernier poste (années)</label>
    <input type="number" step="0.1" min="0" id="anciennete_poste_ans" name="anciennete_poste_ans" value="3" required>

    <label for="code_rome_vise">Code ROME visé</label>
    <select id="code_rome_vise" name="code_rome_vise" required>
      <option value="M1805" selected>M1805 - Études et développement informatique</option>
      <option value="M1806">M1806 - Conseil et maîtrise d'ouvrage en systèmes d'information</option>
      <option value="M1802">M1802 - Expertise et support en systèmes d'information</option>
      <option value="M1403">M1403 - Études et développement marketing</option>
      <option value="D1404">D1404 - Management et gestion de rayon alimentation</option>
      <option value="F1602">F1602 - Électricité - bâtiment</option>
      <option value="I1308">I1308 - Maintenance de machine industrielle</option>
      <option value="N1103">N1103 - Magasinage et préparation de commandes</option>
      <option value="K1304">K1304 - Services domestiques</option>
      <option value="G1203">G1203 - Animation de loisirs divers</option>
    </select>

    <label for="est_allocataire">Allocataire</label>
    <select id="est_allocataire" name="est_allocataire" required>
      <option value="1" selected>Oui</option>
      <option value="0">Non</option>
    </select>

    <label for="departement">Département</label>
    <select id="departement" name="code_insee_commune" required>

      <option value="02">02 - Aisne</option>
      <option value="03">03 - Allier</option>
      <option value="04">04 - Alpes-de-Haute-Provence</option>
      <option value="05">05 - Hautes-Alpes</option>
      <option value="06">06 - Alpes-Maritimes</option>
      <option value="07">07 - Ardèche</option>
      <option value="08">08 - Ardennes</option>
      <option value="09">09 - Ariège</option>
      <option value="10">10 - Aube</option>
      <option value="11">11 - Aude</option>
      <option value="12">12 - Aveyron</option>
      <option value="13">13 - Bouches-du-Rhône</option>
      <option value="14">14 - Calvados</option>
      <option value="15">15 - Cantal</option>
      <option value="16">16 - Charente</option>
      <option value="17">17 - Charente-Maritime</option>
      <option value="18">18 - Cher</option>
      <option value="19">19 - Corrèze</option>
      <option value="2A">2A - Corse-du-Sud</option>
      <option value="2B">2B - Haute-Corse</option>
      <option value="21">21 - Côte-d'Or</option>

      <option value="23">23 - Creuse</option>
      <option value="24">24 - Dordogne</option>

      <option value="26">26 - Drôme</option>
      <option value="27">27 - Eure</option>
      <option value="28">28 - Eure-et-Loir</option>
      <option value="29">29 - Finistère</option>
      <option value="30">30 - Gard</option>
      <option value="31">31 - Haute-Garonne</option>
      <option value="32">32 - Gers</option>
      <option value="33">33 - Gironde</option>
      <option value="34">34 - Hérault</option>
      <option value="35">35 - Ille-et-Vilaine</option>
      <option value="36">36 - Indre</option>
      <option value="37">37 - Indre-et-Loire</option>
      <option value="38">38 - Isère</option>
      <option value="39">39 - Jura</option>
      <option value="40">40 - Landes</option>
      <option value="41">41 - Loir-et-Cher</option>
      <option value="42">42 - Loire</option>
      <option value="43">43 - Haute-Loire</option>
      <option value="44">44 - Loire-Atlantique</option>
      <option value="45">45 - Loiret</option>
      <option value="46">46 - Lot</option>
      <option value="47">47 - Lot-et-Garonne</option>
      <option value="48">48 - Lozère</option>
      <option value="49">49 - Maine-et-Loire</option>
      <option value="50">50 - Manche</option>
      <option value="51">51 - Marne</option>
      <option value="52">52 - Haute-Marne</option>

      <option value="72">72 - Sarthe</option>
      <option value="73">73 - Savoie</option>

      <option value="976">976 - Mayotte</option>
    </select>

    <label for="synthese_entretien">Synthèse de l'entretien</label>
    <textarea id="synthese_entretien" name="synthese_entretien" required>Recherche un emploi stable dans le domaine informatique.</textarea>

    <button type="submit">Évaluer le retour à l'emploi</button>
  </form>

  <div id="result"></div>

  <section id="feedbackPanel" aria-labelledby="feedbackTitle">
    <h2 id="feedbackTitle">Confirmer le résultat observé</h2>
    <p>Dossier scoré : <strong id="requestId"></strong></p>
    <form id="feedbackForm">
      <label for="trueLabel">Résultat réel du dossier</label>
      <select id="trueLabel" name="true_label" required>
        <option value="0">Retour rapide</option>
        <option value="1">Retour moyen</option>
        <option value="2">Risque de chômage longue durée</option>
      </select>
      <label for="feedbackComments">Commentaire conseiller (facultatif)</label>
      <textarea id="feedbackComments" name="comments" placeholder="Contexte ou précision utile pour le prochain entraînement"></textarea>
      <button type="submit">Enregistrer le résultat</button>
      <p id="feedbackStatus" role="status" aria-live="polite"></p>
    </form>
  </section>

  <script>
    const form = document.getElementById('scoreForm');
    const result = document.getElementById('result');
    const feedbackPanel = document.getElementById('feedbackPanel');
    const feedbackForm = document.getElementById('feedbackForm');
    const requestIdElement = document.getElementById('requestId');
    const trueLabel = document.getElementById('trueLabel');
    const feedbackComments = document.getElementById('feedbackComments');
    const feedbackStatus = document.getElementById('feedbackStatus');
    const labels = { 0: 'Retour rapide', 1: 'Retour moyen', 2: 'Risque de chômage longue durée' };
    let scoredRequestId = null;
    let scoredPrediction = null;

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = new FormData(form);
      const departement = data.get('code_insee_commune');
      const codeInseeCompatible = departement.length === 2
        ? `${departement}000`
        : departement;
      const payload = {
        age: Number(data.get('age')),
        niveau_diplome: data.get('niveau_diplome'),
        anciennete_poste_ans: Number(data.get('anciennete_poste_ans')),
        code_rome_vise: data.get('code_rome_vise'),
        est_allocataire: Number(data.get('est_allocataire')),
        code_insee_commune: codeInseeCompatible,
        synthese_entretien: data.get('synthese_entretien')
      };

      try {
        const response = await fetch('/api/score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);

        const probabilities = Object.entries(body.probabilities)
          .map(([key, value]) => `${labels[key]} : ${(value * 100).toFixed(1)}%`)
          .join(' | ');
        result.textContent = `${labels[body.prediction]} - ${probabilities} (modèle ${body.model_version})`;
        result.className = body.prediction === 2 ? 'ko' : 'ok';
        scoredRequestId = body.request_id;
        scoredPrediction = body.prediction;
        requestIdElement.textContent = scoredRequestId;
        trueLabel.value = String(scoredPrediction);
        feedbackComments.value = '';
        feedbackStatus.textContent = '';
        feedbackPanel.style.display = 'block';
      } catch (error) {
        result.textContent = `Erreur : ${error.message}`;
        result.className = 'ko';
        feedbackPanel.style.display = 'none';
      }
      result.style.display = 'block';
    });

    feedbackForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!scoredRequestId) return;

      const submitButton = feedbackForm.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      feedbackStatus.textContent = 'Enregistrement...';
      try {
        const response = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            request_id: scoredRequestId,
            prediction: scoredPrediction,
            true_label: Number(trueLabel.value),
            comments: feedbackComments.value || null
          })
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
        feedbackStatus.textContent = body.status === 'already_registered'
          ? 'Ce résultat avait déjà été enregistré.'
          : 'Résultat enregistré pour la boucle de feedback.';
        feedbackForm.querySelectorAll('select, textarea, button').forEach((element) => {
          element.disabled = true;
        });
      } catch (error) {
        feedbackStatus.textContent = `Erreur : ${error.message}`;
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
