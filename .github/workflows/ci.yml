name: CI/CD CISIA Emploi

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install ruff
      - name: Run Ruff
        run: ruff check services scripts tests

  tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r services/model/requirements.txt -r services/backend/requirements.txt pytest httpx
      - name: Run unit tests
        run: >-
          pytest -v services/model/tests
          -k "train_requires_at_least_ten_records or train_rejects_invalid_token or train_returns_mlflow_run"
      - name: Run model API tests
        run: >-
          pytest -v services/model/tests
          -k "health_ok or predict_valid_returns_class_and_proba or predict_invalid_returns_422 or metrics_endpoint_exposes_prometheus"
      - name: Run backend API tests
        run: >-
          pytest -v services/backend/tests
          -k "score_calls_model_and_returns_prediction or train_validates_minimum_records"

  contract-tests:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract-test dependencies
        run: pip install -r services/model/requirements.txt pytest
      - name: Run model contract test
        run: pytest -v services/model/tests/test_api.py -k test_model_contract_features_and_output

  model-evaluation:
    needs: contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluation dependencies
        run: pip install -r requirements-dev.txt
      - name: Run evaluation tests
        run: pytest -v tests/test_evaluation.py
      - name: Run model quality gate
        run: python scripts/evaluate_model.py --release-tag ${{ github.ref_name }}
      - name: Upload MLflow artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-${{ github.run_id }}
          path: mlruns/

  build-images:
    needs: model-evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute image name
        run: |
          REPO_LC=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${REPO_LC}" >> "$GITHUB_ENV"
      - name: Build service images
        run: |
          for service in model backend frontend; do
            docker build \
              -t "${IMAGE_PREFIX}/${service}:${GITHUB_SHA}" \
              -t "${IMAGE_PREFIX}/${service}:latest" \
              -t "${IMAGE_PREFIX}/${service}:${GITHUB_REF_NAME}" \
              "./services/${service}"
          done
          docker save \
            "${IMAGE_PREFIX}/model:${GITHUB_SHA}" \
            "${IMAGE_PREFIX}/model:latest" \
            "${IMAGE_PREFIX}/model:${GITHUB_REF_NAME}" \
            "${IMAGE_PREFIX}/backend:${GITHUB_SHA}" \
            "${IMAGE_PREFIX}/backend:latest" \
            "${IMAGE_PREFIX}/backend:${GITHUB_REF_NAME}" \
            "${IMAGE_PREFIX}/frontend:${GITHUB_SHA}" \
            "${IMAGE_PREFIX}/frontend:latest" \
            "${IMAGE_PREFIX}/frontend:${GITHUB_REF_NAME}" \
            --output service-images.tar
      - name: Upload image artefact
        uses: actions/upload-artifact@v4
        with:
          name: service-images-${{ github.run_id }}
          path: service-images.tar

  push-images:
    needs: build-images
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image artefact
        uses: actions/download-artifact@v4
        with:
          name: service-images-${{ github.run_id }}
      - name: Load service images
        run: docker load --input service-images.tar
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name
        run: |
          REPO_LC=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${REPO_LC}" >> "$GITHUB_ENV"
      - name: Push service images
        run: |
          for service in model backend frontend; do
            docker push --all-tags "${IMAGE_PREFIX}/${service}"
          done

  release:
    needs: push-images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes

  notify-failure:
    needs:
      - lint
      - tests
      - contract-tests
      - model-evaluation
      - build-images
      - push-images
      - release
    if: >-
      always() &&
      (needs.lint.result == 'failure' ||
        needs.tests.result == 'failure' ||
       needs.contract-tests.result == 'failure' ||
       needs.model-evaluation.result == 'failure' ||
      needs.build-images.result == 'failure' ||
      needs.push-images.result == 'failure' ||
      needs.release.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Validate Discord secret
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Missing GitHub secret DISCORD_WEBHOOK_URL"
            exit 1
          fi

          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*)
              echo "Discord webhook URL detected"
              ;;
            *)
              echo "Invalid Discord webhook URL. Expected something like https://discord.com/api/webhooks/..."
              exit 1
              ;;
          esac

      - name: Notify Discord on evaluation failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data @- <<JSON
          {
            "username": "Model Gate",
            "embeds": [
              {
                "title": "🚨 Release blocked by evaluation gate",
                "description": "The model evaluation failed for this repository.",
                "color": 15158332,
                "fields": [
                  { "name": "Repository", "value": "${{ github.repository }}", "inline": true },
                  { "name": "Branch", "value": "${{ github.ref_name }}", "inline": true },
                  { "name": "Run", "value": "[Open run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false }
                ]
              }
            ]
          }
          JSON
