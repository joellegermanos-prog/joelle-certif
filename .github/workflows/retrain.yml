name: CISIA feedback retraining

on:
  workflow_dispatch:
    inputs:
      min_feedback:
        description: Minimum number of unconsumed feedbacks
        required: false
        default: "200"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: cisia-feedback-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: python -m pip install -r services/model/requirements.txt
      - name: Initialize feedback database schema
        run: python scripts/init_feedback_db.py --path data/feedbacks.db
      - name: Run threshold-protected retraining
        env:
          MIN_FEEDBACK: ${{ inputs.min_feedback || '200' }}
        run: |
          python scripts/retrain.py --min-feedback "$MIN_FEEDBACK" | tee retrain-result.json
      - name: Publish retraining results in run summary
        if: always()
        run: |
          {
            echo "## CISIA feedback retraining"
            if [ -s retrain-result.json ]; then
              echo "### Retraining result"
              echo '```text'
              cat retrain-result.json
              echo '```'
            else
              echo "No retraining result was produced."
            fi
            if [ -s decisions_log.jsonl ]; then
              echo "### Latest promotion decision"
              echo '```json'
              tail -n 1 decisions_log.jsonl
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
