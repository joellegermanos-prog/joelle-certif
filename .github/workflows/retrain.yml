name: CISIA feedback retraining

on:
  workflow_dispatch:
    inputs:
      min_feedback:
        description: Minimum number of unconsumed feedbacks
        required: false
        default: "200"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: cisia-feedback-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      IMAGE_TAG: latest
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MIN_FEEDBACK: ${{ inputs.min_feedback || '200' }}
    steps:
      - name: Validate remote retraining configuration
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || \
             [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_PATH must be configured."
            exit 1
          fi
      - name: Run retrainer on the production feedback volume
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GHCR_USERNAME: ${{ env.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ env.GHCR_TOKEN }}
          MIN_FEEDBACK: ${{ env.MIN_FEEDBACK }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,IMAGE_PREFIX,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN,MIN_FEEDBACK
          script_stop: true
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            IMAGE_PREFIX="$IMAGE_PREFIX" IMAGE_TAG="$IMAGE_TAG" docker compose --profile retrain pull retrainer
            IMAGE_PREFIX="$IMAGE_PREFIX" IMAGE_TAG="$IMAGE_TAG" docker compose --profile retrain run --rm retrainer python scripts/retrain.py --min-feedback "$MIN_FEEDBACK"
      - name: Publish retraining summary
        if: always()
        run: |
          {
            echo "## CISIA feedback retraining"
            echo "Runs on the deployment host against the persistent Docker feedback_data volume."
            echo "See the preceding SSH step logs for the feedback count and promotion decision."
            echo "Minimum new feedbacks: $MIN_FEEDBACK"
          } >> "$GITHUB_STEP_SUMMARY"
